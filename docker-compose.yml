services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro_iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agro_iot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  migrate:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-agro_iot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-agro_iot}
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["sh", "-c", "set -eu; for file in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f \"$$file\"; done"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agro_iot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-agro_iot}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
      MAX_TELEMETRY_BODY_BYTES: ${MAX_TELEMETRY_BODY_BYTES:-65536}
      MAX_LEGACY_BODY_BYTES: ${MAX_LEGACY_BODY_BYTES:-1048576}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:-development-only-change-this-credential-pepper}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-api-key-change-me}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-admin-secret-key-change-me-now}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
